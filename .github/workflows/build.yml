name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Project with Dual Native Widgets
        run: |
          cp lib/main.dart /tmp/main.dart
          rm -rf lib pubspec.yaml
          flutter create . --project-name islamic_app --org com.noor
          cp /tmp/main.dart lib/main.dart

          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/drawable

          cat << 'EOF' > android/app/src/main/res/drawable/bg_widget_gold.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:startColor="#141E30" android:endColor="#070B12" android:angle="135"/>
              <corners android:radius="22dp"/>
              <stroke android:width="1.5dp" android:color="#D4AF37"/>
          </shape>
          EOF

          cat << 'EOF' > android/app/src/main/res/layout/widget_quran.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp"
              android:gravity="center"
              android:background="@drawable/bg_widget_gold">
              <TextView
                  android:id="@+id/wq_ref"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="✨ NOOR QURAN VERSE • 94:5"
                  android:textColor="#D4AF37"
                  android:textSize="10sp"
                  android:textStyle="bold" />
              <TextView
                  android:id="@+id/wq_arab"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="6dp"
                  android:gravity="center"
                  android:text="فَإِنَّ مَعَ الْعُسْرِ يُسْرًا"
                  android:textColor="#FFFFFF"
                  android:textSize="22sp"
                  android:textStyle="bold" />
              <TextView
                  android:id="@+id/wq_hinglish"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="6dp"
                  android:gravity="center"
                  android:text="Beshak, har mushkil ke sath aasani hai."
                  android:textColor="#10B981"
                  android:textSize="12sp"
                  android:textStyle="italic" />
          </LinearLayout>
          EOF

          cat << 'EOF' > android/app/src/main/res/layout/widget_prayer.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp"
              android:gravity="center_vertical"
              android:background="@drawable/bg_widget_gold">
              <TextView
                  android:id="@+id/wp_loc"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="🕌 NOOR CELESTIAL • LIVE SALAH"
                  android:textColor="#D4AF37"
                  android:textSize="10sp"
                  android:textStyle="bold" />
              <TextView
                  android:id="@+id/wp_next"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp"
                  android:text="Next: Fajr (04:15 AM) • Mag: 04:32 PM"
                  android:textColor="#FFFFFF"
                  android:textSize="17sp"
                  android:textStyle="bold" />
              <TextView
                  android:id="@+id/wp_strip"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="6dp"
                  android:text="Fajr 04:15 | Dhuhr 12:30 | Asr 02:59 | Mag 04:32 | Isha 06:24"
                  android:textColor="#10B981"
                  android:textSize="11sp"
                  android:textStyle="bold" />
          </LinearLayout>
          EOF

          cat << 'EOF' > android/app/src/main/res/xml/info_quran.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="100dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_quran"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          cat << 'EOF' > android/app/src/main/res/xml/info_prayer.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="100dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_prayer"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          PKG_DIR=$(find android/app/src/main/kotlin -type d | tail -n 1)
          PKG_NAME=$(grep -oP 'package\s+\K[^\s;]+' "$PKG_DIR/MainActivity.kt")

          cat << EOF > "$PKG_DIR/QuranWidget.kt"
          package $PKG_NAME
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.widget.RemoteViews

          class QuranWidget : AppWidgetProvider() {
              override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray) {
                  val prefs = context.getSharedPreferences("FlutterSharedPreferences", Context.MODE_PRIVATE)
                  val ref = prefs.getString("flutter.wq_ref", "✨ NOOR QURAN VERSE • 94:5")
                  val arab = prefs.getString("flutter.wq_arab", "فَإِنَّ مَعَ الْعُسْرِ يُسْرًا")
                  val hing = prefs.getString("flutter.wq_hing", "Beshak, har mushkil ke sath aasani hai.")
                  for (id in ids) {
                      val v = RemoteViews(context.packageName, R.layout.widget_quran)
                      v.setTextViewText(R.id.wq_ref, ref)
                      v.setTextViewText(R.id.wq_arab, arab)
                      v.setTextViewText(R.id.wq_hinglish, hing)
                      manager.updateAppWidget(id, v)
                  }
              }
          }
          EOF

          cat << EOF > "$PKG_DIR/PrayerWidget.kt"
          package $PKG_NAME
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.widget.RemoteViews

          class PrayerWidget : AppWidgetProvider() {
              override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray) {
                  val prefs = context.getSharedPreferences("FlutterSharedPreferences", Context.MODE_PRIVATE)
                  val loc = prefs.getString("flutter.wp_loc", "🕌 NOOR CELESTIAL • LIVE SALAH")
                  val next = prefs.getString("flutter.wp_next", "Next: Fajr (04:15 AM)")
                  val strip = prefs.getString("flutter.wp_strip", "Fajr 04:15 | Dhuhr 12:30 | Asr 02:59 | Mag 04:32 | Isha 06:24")
                  for (id in ids) {
                      val v = RemoteViews(context.packageName, R.layout.widget_prayer)
                      v.setTextViewText(R.id.wp_loc, loc)
                      v.setTextViewText(R.id.wp_next, next)
                      v.setTextViewText(R.id.wp_strip, strip)
                      manager.updateAppWidget(id, v)
                  }
              }
          }
          EOF

          sed -i '/<manifest/a <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<\/application>/<receiver android:name=".QuranWidget" android:label="Noor Quran Verse Widget" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"\/><\/intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml\/info_quran"\/><\/receiver><receiver android:name=".PrayerWidget" android:label="Noor Prayer Time Widget" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"\/><\/intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml\/info_prayer"\/><\/receiver><\/application>/g' android/app/src/main/AndroidManifest.xml

          flutter pub add http shared_preferences audioplayers sensors_plus
          flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Islamic-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk
