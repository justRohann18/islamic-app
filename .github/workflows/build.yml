name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Project with Luxury Split-Pane Widgets
        run: |
          cp lib/main.dart /tmp/main.dart
          rm -rf lib pubspec.yaml
          flutter create . --project-name islamic_app --org com.noor
          cp /tmp/main.dart lib/main.dart

          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/drawable

          cat << 'EOF' > android/app/src/main/res/drawable/bg_noor_card.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:startColor="#0D2B26" android:centerColor="#081C1A" android:endColor="#051014" android:angle="135"/>
              <corners android:radius="26dp"/>
              <stroke android:width="1.5dp" android:color="#4DD4AF37"/>
          </shape>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/bg_noor_pill.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#163D37"/>
              <corners android:radius="16dp"/>
              <stroke android:width="1dp" android:color="#6610B981"/>
          </shape>
          EOF

          cat << 'EOF' > android/app/src/main/res/layout/widget_prayer.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="horizontal"
              android:padding="16dp"
              android:background="@drawable/bg_noor_card">

              <LinearLayout
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="5"
                  android:orientation="vertical">
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal">
                      <TextView
                          android:id="@+id/wp_loc"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="🕌 NOOR"
                          android:textColor="#FFFFFF"
                          android:textSize="11sp"
                          android:textStyle="bold" />
                      <TextView
                          android:id="@+id/wp_curr_badge"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:background="@drawable/bg_noor_pill"
                          android:paddingLeft="8dp"
                          android:paddingRight="8dp"
                          android:paddingTop="2dp"
                          android:paddingBottom="2dp"
                          android:text="FAJR • ACTIVE"
                          android:textColor="#FFD700"
                          android:textSize="9sp"
                          android:textStyle="bold" />
                  </LinearLayout>

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:text="UPCOMING SALAH"
                      android:textColor="#94A3B8"
                      android:textSize="9sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/wp_next_name"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Dhuhr"
                      android:textColor="#FFFFFF"
                      android:textSize="24sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/wp_next"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:fontFamily="serif"
                      android:text="12:30 PM"
                      android:textColor="#FFD700"
                      android:textSize="22sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/wp_rem_pill"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:background="@drawable/bg_noor_pill"
                      android:padding="7dp"
                      android:text="● NEXT IN   -04:18:00"
                      android:textColor="#2DD4BF"
                      android:textSize="11sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <LinearLayout
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="4"
                  android:paddingLeft="12dp"
                  android:gravity="center_vertical"
                  android:orientation="vertical">
                  <TextView
                      android:id="@+id/wp_t1"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="🌅 Fajr        04:15 AM"
                      android:textColor="#CBD5E1"
                      android:textSize="11sp" />
                  <TextView
                      android:id="@+id/wp_t2"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:layout_marginBottom="8dp"
                      android:background="@drawable/bg_noor_pill"
                      android:padding="8dp"
                      android:text="☀️ Dhuhr     12:30 PM"
                      android:textColor="#2DD4BF"
                      android:textSize="11sp"
                      android:textStyle="bold" />
                  <TextView
                      android:id="@+id/wp_t3"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="⛅ Asr          02:59 PM"
                      android:textColor="#CBD5E1"
                      android:textSize="11sp" />
              </LinearLayout>
          </LinearLayout>
          EOF

          cat << 'EOF' > android/app/src/main/res/layout/widget_quran.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp"
              android:gravity="center_vertical"
              android:background="@drawable/bg_noor_card">
              <TextView
                  android:id="@+id/wq_ref"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:background="@drawable/bg_noor_pill"
                  android:paddingLeft="10dp"
                  android:paddingRight="10dp"
                  android:paddingTop="3dp"
                  android:paddingBottom="3dp"
                  android:text="✨ NOOR QURAN • 94:5"
                  android:textColor="#FFD700"
                  android:textSize="10sp"
                  android:textStyle="bold" />
              <TextView
                  android:id="@+id/wq_arab"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:gravity="right"
                  android:text="فَإِنَّ مَعَ الْعُسْرِ يُسْرًا"
                  android:textColor="#FFFFFF"
                  android:textSize="24sp"
                  android:textStyle="bold" />
              <TextView
                  android:id="@+id/wq_hinglish"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="6dp"
                  android:fontFamily="serif"
                  android:text="Beshak, har mushkil ke sath aasani hai."
                  android:textColor="#2DD4BF"
                  android:textSize="13sp"
                  android:textStyle="italic" />
          </LinearLayout>
          EOF

          cat << 'EOF' > android/app/src/main/res/xml/info_quran.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="280dp"
              android:minHeight="110dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_quran"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          cat << 'EOF' > android/app/src/main/res/xml/info_prayer.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="280dp"
              android:minHeight="120dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_prayer"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          PKG_DIR=$(find android/app/src/main/kotlin -type d | tail -n 1)
          PKG_NAME=$(grep -oP 'package\s+\K[^\s;]+' "$PKG_DIR/MainActivity.kt")

          cat << EOF > "$PKG_DIR/QuranWidget.kt"
          package $PKG_NAME
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.widget.RemoteViews

          class QuranWidget : AppWidgetProvider() {
              override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray) {
                  val prefs = context.getSharedPreferences("FlutterSharedPreferences", Context.MODE_PRIVATE)
                  val ref = prefs.getString("flutter.wq_ref", "✨ NOOR QURAN • 94:5")
                  val arab = prefs.getString("flutter.wq_arab", "فَإِنَّ مَعَ الْعُسْرِ يُسْرًا")
                  val hing = prefs.getString("flutter.wq_hing", "Beshak, har mushkil ke sath aasani hai.")
                  for (id in ids) {
                      val v = RemoteViews(context.packageName, R.layout.widget_quran)
                      v.setTextViewText(R.id.wq_ref, ref)
                      v.setTextViewText(R.id.wq_arab, arab)
                      v.setTextViewText(R.id.wq_hinglish, hing)
                      manager.updateAppWidget(id, v)
                  }
              }
          }
          EOF

          cat << EOF > "$PKG_DIR/PrayerWidget.kt"
          package $PKG_NAME
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.widget.RemoteViews

          class PrayerWidget : AppWidgetProvider() {
              override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray) {
                  val prefs = context.getSharedPreferences("FlutterSharedPreferences", Context.MODE_PRIVATE)
                  val loc = prefs.getString("flutter.wp_loc", "🕌 NOOR")
                  val nextName = prefs.getString("flutter.wp_next_name", "Dhuhr")
                  val nextTime = prefs.getString("flutter.wp_next", "12:30 PM")
                  for (id in ids) {
                      val v = RemoteViews(context.packageName, R.layout.widget_prayer)
                      v.setTextViewText(R.id.wp_loc, loc)
                      v.setTextViewText(R.id.wp_next_name, nextName)
                      v.setTextViewText(R.id.wp_next, nextTime)
                      manager.updateAppWidget(id, v)
                  }
              }
          }
          EOF

          sed -i '/<manifest/a <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<\/application>/<receiver android:name=".QuranWidget" android:label="Noor Quran Verse Widget" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"\/><\/intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml\/info_quran"\/><\/receiver><receiver android:name=".PrayerWidget" android:label="Noor Horizon Prayer Widget" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"\/><\/intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml\/info_prayer"\/><\/receiver><\/application>/g' android/app/src/main/AndroidManifest.xml

          flutter pub add http shared_preferences audioplayers sensors_plus
          flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Islamic-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk
