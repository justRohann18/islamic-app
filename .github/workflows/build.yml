name: Build APK and Source ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Project & Create ZIP
        run: |
          cp lib/main.dart /tmp/main.dart
          flutter create . --project-name islamic_app
          cp /tmp/main.dart lib/main.dart
          flutter pub add http shared_preferences audioplayers
          zip -r source_code.zip lib pubspec.yaml
          flutter build apk --release

      - name: Download Source Code ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Islamic-App-Source-Code-ZIP
          path: source_code.zip

      - name: Download Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Islamic-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk
