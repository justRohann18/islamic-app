name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Project with Internet Permission
        run: |
          cp lib/main.dart /tmp/main.dart
          rm -rf lib pubspec.yaml
          flutter create . --project-name islamic_app
          cp /tmp/main.dart lib/main.dart
          sed -i '/<manifest/a <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          flutter pub add http shared_preferences audioplayers
          flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Islamic-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk
