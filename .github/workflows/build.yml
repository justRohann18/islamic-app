name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Folder & Inject Native Home Widget
        run: |
          mv lib/main.dart main_backup.dart
          mv pubspec.yaml pubspec_backup.yaml
          flutter create . --project-name islamic_app --org com.example
          mv main_backup.dart lib/main.dart
          mv pubspec_backup.yaml pubspec.yaml

          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/drawable

          cat << 'EOF' > android/app/src/main/res/drawable/widget_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:startColor="#0F2932" android:endColor="#064E3B" android:angle="135"/>
              <corners android:radius="20dp"/>
              <stroke android:width="2dp" android:color="#FFD700"/>
          </shape>
          EOF

          cat << 'EOF' > android/app/src/main/res/layout/prayer_widget.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="14dp"
              android:gravity="center_vertical"
              android:background="@drawable/widget_bg">
              <TextView
                  android:id="@+id/tv_location"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="🌙 Noor Islamic • Rupahi"
                  android:textColor="#FFD700"
                  android:textSize="12sp"
                  android:textStyle="bold" />
              <TextView
                  android:id="@+id/tv_next_prayer"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp"
                  android:text="Next: Fajr (04:45)"
                  android:textColor="#FFFFFF"
                  android:textSize="20sp"
                  android:textStyle="bold" />
              <TextView
                  android:id="@+id/tv_tracker"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp"
                  android:text="Today Tracker: 0/5 Offered ✅"
                  android:textColor="#10B981"
                  android:textSize="13sp"
                  android:textStyle="bold" />
          </LinearLayout>
          EOF

          cat << 'EOF' > android/app/src/main/res/xml/prayer_widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="90dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/prayer_widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          PKG_DIR=$(find android/app/src/main/kotlin -type d | tail -n 1)
          PKG_NAME=$(grep -oP 'package\s+\K[^\s;]+' "$PKG_DIR/MainActivity.kt")

          cat << EOF > "$PKG_DIR/PrayerWidgetProvider.kt"
          package $PKG_NAME

          import android.appwidget.AppWidgetManager
          import android.content.Context
          import android.content.SharedPreferences
          import android.widget.RemoteViews
          import es.antonborri.home_widget.HomeWidgetProvider

          class PrayerWidgetProvider : HomeWidgetProvider() {
              override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray, widgetData: SharedPreferences) {
                  appWidgetIds.forEach { widgetId ->
                      val views = RemoteViews(context.packageName, R.layout.prayer_widget).apply {
                          val nextPrayer = widgetData.getString("wid_next", "Next: Fajr (04:45)")
                          val loc = widgetData.getString("wid_loc", "🌙 Noor Islamic • Rupahi")
                          val tracker = widgetData.getString("wid_track", "Today Tracker: 0/5 Offered ✅")
                          setTextViewText(R.id.tv_next_prayer, nextPrayer)
                          setTextViewText(R.id.tv_location, loc)
                          setTextViewText(R.id.tv_tracker, tracker)
                      }
                      appWidgetManager.updateAppWidget(widgetId, views)
                  }
              }
          }
          EOF

          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/><application/g' android/app/src/main/AndroidManifest.xml

          sed -i 's/<\/application>/<receiver android:name=".PrayerWidgetProvider" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" \/><\/intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml\/prayer_widget_info" \/><\/receiver><\/application>/g' android/app/src/main/AndroidManifest.xml

      - name: Get Packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Islamic-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk
