name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Folder & Permissions
        run: |
          mv lib/main.dart main_backup.dart
          mv pubspec.yaml pubspec_backup.yaml
          flutter create . --project-name islamic_app
          mv main_backup.dart lib/main.dart
          mv pubspec_backup.yaml pubspec.yaml
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/><application/g' android/app/src/main/AndroidManifest.xml

      - name: Get Packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Islamic-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk
